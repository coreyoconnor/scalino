name: Setup build dependencies
description: >
  Installs everything build/*.sh needs (Openjdk, coursier, sbt, clang), on Linux/macOS/Windows alike.

runs:
  using: composite
  steps:
    - name: Set up OpenJDK
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up coursier
      uses: coursier/setup-action@v1
      with:
        apps: cs sbt

    - name: Install clang (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -y
        # llvm-dev pulls in llvm-config + libLLVM's per-component *.a static
        # archives (Debian/Ubuntu bundle these into -dev, unlike e.g.
        # Fedora's separate llvm-static): the direct LLVM-C codegen backend
        # is on by default (build/04-build-scalino-linkdriver.sh), which
        # statically links scalino-linkdriver itself against libLLVM so the
        # *released* binary has no libLLVM runtime dependency at all -- end
        # users installing via curl need nothing LLVM-related installed.
        # libzstd-dev provides libzstd.a (needed alongside, for the same
        # reason -- llvm-config's own static libs don't include it even
        # though LLVM_ENABLE_ZSTD pulls it in) and pkg-config is how the
        # build script locates that .a instead of accidentally linking the
        # dynamic libzstd.so sitting right next to it. libtinfo-dev provides
        # the libtinfo.so dev symlink that -ltinfo needs at link time --
        # libLLVMSupport.a calls set_curterm/setupterm/tigetnum/del_curterm
        # directly (Process::FileDescriptorHasColors), which llvm-config
        # --system-libs doesn't report (same gap as zstd); the runner ships
        # libtinfo6's runtime .so.6 already (bash/less need it) but not the
        # unversioned .so symlink -l needs.
        sudo apt-get install -y clang llvm-dev libzstd-dev libtinfo-dev pkg-config

    - name: Install llvm-config/libLLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Xcode command line tools ship clang/clang++ already, but not
        # llvm-config/libLLVM -- the direct LLVM-C codegen backend is on by
        # default (build/04-build-scalino-linkdriver.sh), which statically
        # links scalino-linkdriver itself against libLLVM (+ zstd, pulled in
        # transitively as the llvm formula's own build dependency) so the
        # *released* binary needs nothing LLVM-related installed at runtime
        # -- same reasoning as the Linux step above. pkg-config (used to
        # locate zstd's static .a instead of its dylib) ships preinstalled
        # on GitHub's macOS runners.
        brew install llvm
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

    - name: Locate clang (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # windows-latest images ship LLVM under this prefix;
        # scala-native's C toolchain on Windows is experimental/best-effort
        # (see docs/findings.md) -- this step just makes sure clang/clang++
        # resolve, it doesn't guarantee scala-native links successfully.
        if ! command -v clang >/dev/null 2>&1; then
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
        fi
