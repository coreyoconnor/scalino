name: Setup build dependencies
description: >
  Installs everything build/*.sh needs (Openjdk, coursier, sbt, clang), on Linux/macOS/Windows alike.

runs:
  using: composite
  steps:
    - name: Set up OpenJDK
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up coursier
      uses: coursier/setup-action@v1
      with:
        apps: cs sbt

    - name: Install clang (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -y
        # llvm-dev pulls in llvm-config + libLLVM-*.so: the direct LLVM-C
        # codegen backend is on by default (build/04-build-scalino-linkdriver.sh),
        # so scalino-linkdriver itself needs libLLVM at link time, not just
        # clang -- without it the link fails with "undefined reference to
        # LLVMFunctionType" etc.
        sudo apt-get install -y clang llvm-dev

    - name: Install llvm-config/libLLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Xcode command line tools ship clang/clang++ already, but not
        # llvm-config/libLLVM -- the direct LLVM-C codegen backend is on by
        # default (build/04-build-scalino-linkdriver.sh), so
        # scalino-linkdriver needs libLLVM at link time.
        brew install llvm
        echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

    - name: Locate clang (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # windows-latest images ship LLVM under this prefix;
        # scala-native's C toolchain on Windows is experimental/best-effort
        # (see docs/findings.md) -- this step just makes sure clang/clang++
        # resolve, it doesn't guarantee scala-native links successfully.
        if ! command -v clang >/dev/null 2>&1; then
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
        fi
